<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket ESP 2026</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1c1c2e;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}

.ticket {
  width: 210px;
  background: #eef2f7;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  position: relative;
  padding-bottom: 0;
}

.ticket-inner {
  position: relative;
  overflow: hidden;
}

/* ====== 1. TALON SUPÉRIEUR ====== */
.stub-top {
  background: #ffffff;
  height: 140px;
  padding: 12px 14px;
  position: relative;
}

.logo-e {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  border: 3px solid #00bcd4;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
  color: #00bcd4;
}

.price-vertical {
  position: absolute;
  top: 12px;
  right: 14px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-size: 10px;
  font-weight: bold;
  color: #183828;
  letter-spacing: 1px;
}

.qr-mini {
  position: absolute;
  bottom: 10px;
  right: 14px;
  width: 42px;
  height: 42px;
  background: #ffffff;
  border: 1px solid #cdd5de;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qr-mini svg {
  width: 36px;
  height: 36px;
}

/* ====== 2. SÉPARATEUR PERFORATION ====== */
.perforation {
  height: 20px;
  display: flex;
  align-items: center;
  position: relative;
  background: #ffffff;
}

.perforation-line {
  flex: 1;
  border-top: 2px dashed #b8c2cc;
  margin: 0 10px;
}

.half-circle {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #1c1c2e;
  flex-shrink: 0;
}

.half-circle.left {
  margin-left: -10px;
}

.half-circle.right {
  margin-right: -10px;
}

/* ====== 3. CORPS PRINCIPAL ====== */
.main-body {
  padding: 14px;
  background: #eef2f7;
  position: relative;
  overflow: hidden;
}

.watermark {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-30deg);
  font-size: 64px;
  font-weight: bold;
  color: #4a6a8a;
  opacity: 0.09;
  pointer-events: none;
  white-space: nowrap;
}

.event-title {
  text-align: center;
  font-size: 11.5px;
  font-weight: bold;
  color: #1a1a2e;
  margin-bottom: 10px;
  line-height: 1.3;
}

.separator {
  border: none;
  border-top: 1px solid #cdd5de;
  margin: 8px 0;
}

.info-pair {
  display: flex;
  gap: 8px;
  margin-bottom: 6px;
}

.info-item {
  flex: 1;
}

.info-label {
  font-size: 6.5px;
  color: #8a9aae;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.info-value {
  font-size: 9px;
  font-weight: bold;
  color: #1a1a2e;
}

.qr-central {
  width: 108px;
  height: 108px;
  margin: 12px auto;
  background: #ffffff;
  border: 1px solid #cdd5de;
  border-radius: 8px;
  padding: 7px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
}

.qr-central svg {
  width: 94px;
  height: 94px;
}

.ticket-ref {
  text-align: center;
  font-size: 7px;
  color: #8a9aae;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}

.footer-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.ticket-num {
  font-size: 8px;
  font-weight: bold;
  color: #4a6a8a;
}

.category-badge {
  font-size: 7px;
  font-weight: bold;
  color: #2e6040;
  background: #d4edda;
  padding: 2px 8px;
  border-radius: 10px;
}

/* ====== 4. BANDE DE PRIX ====== */
.price-band {
  background: linear-gradient(135deg, #183828, #2e6040);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
}

.price-info {
  display: flex;
  flex-direction: column;
}

.price-label {
  font-size: 7px;
  color: #8fc0a0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.price-amount {
  font-size: 22px;
  font-weight: bold;
  color: #ffffff;
}

.price-note {
  font-size: 7px;
  color: #8fc0a0;
}

.price-badge {
  background: rgba(255,255,255,0.15);
  border-radius: 12px;
  padding: 4px 10px;
  font-size: 8px;
  font-weight: bold;
  color: #ffffff;
  text-transform: uppercase;
}

/* ====== 5. NUMÉRO DE SÉRIE VERTICAL ====== */
.serial-vertical {
  position: absolute;
  right: 0;
  top: 140px; /* après talon */
  bottom: 0;
  width: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.serial-vertical span {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-size: 6px;
  color: #b8c2cc;
  letter-spacing: 1px;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="ticket">
  <div class="ticket-inner">

    <!-- 1. Talon supérieur -->
    <div class="stub-top">
      <div class="logo-e">e</div>
      <div class="price-vertical">100,00$</div>
      <div class="qr-mini">
        <svg viewBox="0 0 33 33">
          <rect x="0" y="0" width="33" height="33" fill="#fff"/>
          <rect x="2" y="2" width="11" height="11" fill="#000" rx="1"/>

          <rect x="22" y="4" width="7" height="7" fill="#fff"/>
          <rect x="20" y="20" width="4" height="4" fill="#000"/>
          <rect x="26" y="20" width="2" height="4" fill="#000"/>

          <rect x="24" y="24" width="2" height="2" fill="#000"/>

          <rect x="14" y="14" width="2" height="2" fill="#000"/>
          <rect x="2" y="14" width="5" height="2" fill="#000"/>
          <rect x="14" y="18" width="2" height="2" fill="#000"/>
          <rect x="18" y="14" width="2" height="2" fill="#000"/>
        </svg>
      </div>
    </div>

    <!-- 2. Perforation -->
    <div class="perforation">
      <div class="half-circle left"></div>
      <div class="perforation-line"></div>
      <div class="half-circle right"></div>
    </div>

    <!-- 3. Corps principal -->
    <div class="main-body">
      <div class="watermark">ESP</div>

      <div class="event-title">SÉMINAIRE DE RECHERCHE<br>ET D'INNOVATION<br>DE L'ESP 2026</div>

      <hr class="separator">

      <div class="info-pair">
        <div class="info-item">
          <div class="info-label">Date</div>
          <div class="info-value">15 Juin 2026</div>
        </div>
        <div class="info-item">
          <div class="info-label">Horaire</div>
          <div class="info-value">09:00 – 17:00</div>
        </div>
      </div>

      <div class="info-pair">
        <div class="info-item">
          <div class="info-label">Lieu</div>
          <div class="info-value">Amphi A</div>
        </div>
        <div class="info-item">
          <div class="info-label">Type</div>
          <div class="info-value">Présentiel</div>
        </div>
      </div>

      <hr class="separator">

      <div class="qr-central">
        <svg viewBox="0 0 33 33">
          <rect x="0" y="0" width="33" height="33" fill="#fff"/>
          <rect x="2" y="2" width="11" height="11" fill="#000" rx="1"/>
          <rect x="4" y="4" width="7" height="7" fill="#fff"/>
          <rect x="2" y="20" width="11" height="11" fill="#000" rx="1"/>
          <rect x="4" y="22" width="7" height="7" fill="#fff"/>
          <rect x="20" y="2" width="11" height="11" fill="#000" rx="1"/>
          <rect x="22" y="4" width="7" height="7" fill="#fff"/>
          <rect x="20" y="18" width="2" height="4" fill="#000"/>
          <rect x="24" y="18" width="2" height="2" fill="#000"/>
          <rect x="20" y="24" width="4" height="2" fill="#000"/>
          <rect x="20" y="28" width="2" height="3" fill="#000"/>
          <rect x="24" y="22" width="2" height="2" fill="#000"/>
          <rect x="28" y="20" width="3" height="11" fill="#000"/>
          <rect x="14" y="2" width="2" height="2" fill="#000"/>
          <rect x="14" y="10" width="2" height="2" fill="#000"/>
          <rect x="10" y="14" width="2" height="2" fill="#000"/>
          <rect x="14" y="14" width="2" height="2" fill="#000"/>
          <rect x="2" y="14" width="5" height="2" fill="#000"/>
          <rect x="8" y="18" width="2" height="2" fill="#000"/>
          <rect x="2" y="18" width="4" height="2" fill="#000"/>
          <rect x="14" y="18" width="2" height="2" fill="#000"/>
        </svg>
      </div>

      <div class="ticket-ref">REF · TKT-ESP-2026-001</div>

      <div class="footer-line">
        <span class="ticket-num">#00234</span>
        <span class="category-badge">Conférence</span>
      </div>
    </div>

    <!-- 4. Bande de prix -->
    <div class="price-band">
      <div class="price-info">
        <span class="price-label">TARIF</span>
        <span class="price-amount">2 000 FCFA</span>
        <span class="price-note">Entrée unique · Non transférable</span>
      </div>
      <div class="price-badge">STANDARD</div>
    </div>

  </div>

  <!-- 5. Numéro de série vertical -->
  <div class="serial-vertical">
    <span>TKT-ESP-2026-001 · SEMINAIRE ESP 2026</span>
  </div>

</div>
</body>
</html>
