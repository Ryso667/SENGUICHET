<!-- Template : Remboursement effectué -->
<div style="text-align:center;">
  <div style="display:inline-block;width:64px;height:64px;background:rgba(0,229,160,0.2);border:2px solid #00E5A0;border-radius:50%;line-height:60px;text-align:center;">
    <span style="color:#00E5A0;font-size:28px;">&#10003;</span>
  </div>

  <h2 style="color:#FFFFFF;font-size:22px;font-weight:700;margin:20px 0 12px 0;">Votre remboursement a été effectué</h2>

  <p style="color:#A0B4C8;font-size:15px;line-height:1.7;margin:0;">
    Bonjour,<br>
    Votre remboursement de <strong style="color:#FFFFFF;">{MONTANT} FCFA</strong> a été envoyé sur le numéro <strong style="color:#FFFFFF;">{TELEPHONE}</strong> via <strong style="color:#FFFFFF;">{OPERATEUR}</strong>.
  </p>
</div>

<!-- Récapitulatif -->
<div style="background:#0D1B2A;border-radius:12px;padding:20px;margin:24px 0;">
  <p style="color:#6B7280;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin:0 0 16px 0;">RÉCAPITULATIF</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;">
    <tr>
      <td style="padding:10px 0;color:#6B7280;font-size:13px;width:40%;">Montant remboursé</td>
      <td style="padding:10px 0;color:#FFFFFF;font-size:13px;font-weight:700;text-align:right;">{MONTANT} FCFA</td>
    </tr>
    <tr><td colspan="2" style="border-bottom:1px solid rgba(255,255,255,0.06);font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr>
      <td style="padding:10px 0;color:#6B7280;font-size:13px;">Opérateur</td>
      <td style="padding:10px 0;color:#FFFFFF;font-size:13px;font-weight:700;text-align:right;">{OPERATEUR}</td>
    </tr>
    <tr><td colspan="2" style="border-bottom:1px solid rgba(255,255,255,0.06);font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr>
      <td style="padding:10px 0;color:#6B7280;font-size:13px;">Numéro</td>
      <td style="padding:10px 0;color:#FFFFFF;font-size:13px;font-weight:700;text-align:right;">{TELEPHONE}</td>
    </tr>
    <tr><td colspan="2" style="border-bottom:1px solid rgba(255,255,255,0.06);font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr>
      <td style="padding:10px 0;color:#6B7280;font-size:13px;">Référence</td>
      <td style="padding:10px 0;color:#00C8FF;font-size:13px;font-weight:700;text-align:right;">{REFERENCE}</td>
    </tr>
    <tr><td colspan="2" style="border-bottom:1px solid rgba(255,255,255,0.06);font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr>
      <td style="padding:10px 0;color:#6B7280;font-size:13px;">Date</td>
      <td style="padding:10px 0;color:#FFFFFF;font-size:13px;font-weight:700;text-align:right;">{DATE}</td>
    </tr>
  </table>
</div>
